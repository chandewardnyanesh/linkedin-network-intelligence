[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "linkedin-network-intelligence"
version = "0.1.0"
description = "Agent Skills for LinkedIn network intelligence and relationship growth. Drafts and records; never sends."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "Dnyanesh Chandewar" }]
keywords = ["linkedin", "networking", "crm", "icp", "agent-skills", "claude-code"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business",
]
dependencies = ["pydantic>=2.6,<3", "PyYAML>=6.0,<7"]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
dev = ["pytest>=8.0"]

[project.scripts]
lni = "lni.cli:main"

[tool.setuptools]
packages = ["lni"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
